name: Pubblica su GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm ci

      - name: Compila
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/"

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/'

      - name: Pubblica su GitHub Pages
        uses: actions/deploy-pages@v4
